apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tech-radar
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: techradar.flexinfer.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tech-radar
                port:
                  number: 80
