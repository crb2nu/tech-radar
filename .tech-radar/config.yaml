scan:
    files:
        - package.json
        - go.mod
        - requirements.txt
        - pyproject.toml
        - Cargo.toml
        - .mcp.json
        - mcp.json
        - claude_desktop_config.json
        - cline_mcp_settings.json
    mappings:
        react:
            name: React
            quadrant: frameworks
        typescript:
            name: TypeScript
            quadrant: languages
        openai:
            name: OpenAI API
            quadrant: platforms
        anthropic:
            name: Claude API
            quadrant: platforms
        '@anthropic-ai/sdk':
            name: Claude API
            quadrant: platforms
        mcp:
            name: Model Context Protocol
            quadrant: tools
        fastmcp:
            name: FastMCP
            quadrant: tools
        langchain:
            name: LangChain
            quadrant: frameworks
        langgraph:
            name: LangGraph
            quadrant: frameworks
        ollama:
            name: Ollama
            quadrant: platforms
        vllm:
            name: vLLM
            quadrant: platforms
        promptfoo:
            name: Promptfoo
            quadrant: tools
        litellm:
            name: LiteLLM
            quadrant: platforms
        github.com/mark3labs/mcp-go:
            name: mcp-go
            quadrant: tools
        '@modelcontextprotocol/sdk':
            name: Model Context Protocol
            quadrant: tools
        '@modelcontextprotocol/server-filesystem':
            name: Filesystem MCP Server
            quadrant: tools
    exclude: []
visualization:
    colors:
        adopt: '#93c47d'
        assess: '#fbdb84'
        hold: '#efafa9'
        trial: '#93d2c2'
    title: Tech Radar
    show_dots: true
