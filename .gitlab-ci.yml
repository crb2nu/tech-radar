stages:
  - lint
  - test
  - build
  - deploy

variables:
  GO_VERSION: "1.25.7"
  GOTOOLCHAIN: "local"
  CGO_ENABLED: "0"
  GOPROXY: "https://proxy.golang.org,direct"

default:
  interruptible: true

.go-env: &go-env
  image: registry.harbor.lan/library/golang:${GO_VERSION}
  before_script:
    - mkdir -p .cache/gomod .cache/gobuild
    - export GOMODCACHE="$CI_PROJECT_DIR/.cache/gomod"
    - export GOCACHE="$CI_PROJECT_DIR/.cache/gobuild"
    - mkdir -p web/dist
    - test -f web/dist/index.html || printf '<!doctype html>\n' > web/dist/index.html
    - go version

cache:
  key:
    files:
      - go.sum
      - web/pnpm-lock.yaml
  paths:
    - .cache/gomod/
    - .cache/gobuild/
    - web/.pnpm-store/

fmt:
  stage: lint
  <<: *go-env
  script:
    - test -z "$(gofmt -l $(git ls-files '*.go'))"

vet:
  stage: lint
  <<: *go-env
  script:
    - go vet ./...

test:
  stage: test
  <<: *go-env
  script:
    - go test ./... -count=1

build:frontend:
  stage: build
  image: registry.harbor.lan/dockerhub-cache/library/node:20-alpine
  script:
    - cd web
    - corepack enable
    - corepack prepare pnpm@10.13.1 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - pnpm build
  artifacts:
    paths:
      - web/dist/
    expire_in: 1 week

build:backend:
  stage: build
  <<: *go-env
  needs:
    - build:frontend
  script:
    - mkdir -p bin
    - go build -o bin/radar ./cmd/radar
    - ./bin/radar --help >/dev/null
  artifacts:
    paths:
      - bin/radar
      - web/dist/
    expire_in: 1 week

build:container:
  stage: deploy
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  needs:
    - build:frontend
  variables:
    IMAGE_NAME: "registry.flexinfer.ai/services/tech-radar"
  script:
    - mkdir -p /kaniko/.docker
    - |
      AUTH=$(echo -n "${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')
      echo "{\"auths\":{\"registry.flexinfer.ai\":{\"auth\":\"${AUTH}\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/Dockerfile
      --destination $IMAGE_NAME:latest
      --destination $IMAGE_NAME:$CI_COMMIT_SHORT_SHA
  only:
    - main
