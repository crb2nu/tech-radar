# Onboarded to platform/gitops shared CI templates (portfolio-refresh slice 5).
# - lint / test / build:backend extend .go-lint / .go-test / .go-build from
#   ci/templates/go.yml (which also pulls in security.yml: semgrep-sast +
#   secret_detection in stage `test`, plus workflow auto-cancel).
# - Custom jobs (build:frontend, build:container, radar-scan) and their stage
#   names (deploy, scan) are preserved as-is; stage normalization is a later slice.
# NOTE: ci/radar.yml is included by other repos — do not modify it here.

stages:
  - lint
  - test
  - build
  - deploy
  - scan

include:
  - local: '/ci/radar.yml'
  - project: 'platform/gitops'
    file: '/ci/templates/go.yml'

variables:
  GO_VERSION: "1.25.7"
  GOTOOLCHAIN: "local"
  CGO_ENABLED: "0"
  GOPROXY: "https://proxy.golang.org,direct"

default:
  interruptible: true

# tech-radar embeds the built frontend (web/dist) into the Go binary; Go jobs
# that compile without the real frontend artifact need a stub index.html.
.radar-webdist-stub: &radar-webdist-stub
  - mkdir -p web/dist
  - test -f web/dist/index.html || printf '<!doctype html>\n' > web/dist/index.html

# Global cache serves the remaining custom jobs (build:frontend pnpm store).
# Template Go jobs define their own split gomod/gobuild caches.
cache:
  key:
    files:
      - go.sum
      - web/pnpm-lock.yaml
  paths:
    - .cache/gomod/
    - .cache/gobuild/
    - web/.pnpm-store/

lint:
  extends: .go-lint
  # Keep the repo's pinned local-registry Go image (template allows per-job override).
  image: registry.harbor.lan/library/golang:${GO_VERSION}
  before_script:
    - !reference [.go-base, before_script]
    - *radar-webdist-stub

test:
  extends: .go-test
  image: registry.harbor.lan/library/golang:${GO_VERSION}
  variables:
    # .go-base sets CGO_ENABLED=0, but the template test job uses -race, which
    # requires cgo (matches Makefile `go test -race -cover`).
    CGO_ENABLED: "1"
  before_script:
    - !reference [.go-base, before_script]
    - *radar-webdist-stub

build:frontend:
  stage: build
  image: docker.io/library/node:20-alpine
  script:
    - cd web
    - corepack enable
    - corepack prepare pnpm@10.13.1 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - pnpm build
  artifacts:
    paths:
      - web/dist/
    expire_in: 1 week

build:backend:
  extends: .go-build
  image: registry.harbor.lan/library/golang:${GO_VERSION}
  needs:
    - build:frontend
  before_script:
    - !reference [.go-base, before_script]
    - *radar-webdist-stub
  script:
    - !reference [.go-build, script]
    - ./bin/radar --help >/dev/null
  artifacts:
    paths:
      - bin/
      - web/dist/
    expire_in: 1 week

build:container:
  stage: deploy
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  needs:
    - build:frontend
  variables:
    IMAGE_REGISTRY: "registry.harbor.lan"
    IMAGE_REPO: "mcp/tech-radar"
    DOCKER_CONFIG: "/kaniko/.docker"
  script:
    - mkdir -p "$DOCKER_CONFIG"
    - |
      if [ -f /docker-secrets/config.json ]; then
        echo "Using pre-configured docker secrets"
        cp /docker-secrets/config.json "$DOCKER_CONFIG/config.json"
      else
        printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}' \
          "$IMAGE_REGISTRY" "$HARBOR_USERNAME" "$HARBOR_PASSWORD" > "$DOCKER_CONFIG/config.json"
      fi
    - export IMAGE="$IMAGE_REGISTRY/$IMAGE_REPO"
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/Dockerfile" --destination "$IMAGE:latest" --destination "$IMAGE:$CI_COMMIT_SHORT_SHA"
  only:
    - main

radar-scan:
  extends: .radar-scan
  stage: scan
  needs: ["build:container"]
  variables:
    RADAR_API_URL: "http://tech-radar.tech-radar.svc.cluster.local/api/v1/ingest"
